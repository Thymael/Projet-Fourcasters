[project]
name = "fourcasters-dbt"
version = "0.1.0"
description = "Pipeline de transformation des données Open-Meteo du projet Fourcasters"
readme = "README.md"
authors = [
    { name = "MARTIN Loïck" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.0",
    "google-auth>=2.57.0",
    "google-cloud-bigquery>=3.44.0",
    "google-cloud-storage>=3.1.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
fourcasters-dbt = "fourcasters_dbt:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
