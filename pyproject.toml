[project]
name = "fourcasters-dbt"
version = "0.1.0"
description = "Pipeline de transformation des données Open-Meteo du projet Fourcasters"
readme = "README.md"
authors = [
    { name = "MARTIN Loïck" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.0",
]

[project.scripts]
fourcasters-dbt = "fourcasters_dbt:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
