version: 2

models:
  - name: int_meteo_communes
    description: "Observations météo enrichies avec le référentiel des communes."
    columns:
      - name: row_hash
        description: "Identifiant unique d'une observation."
        data_tests: [not_null, unique]
      - name: date
        data_tests: [not_null]
      - name: code_insee
        data_tests: [not_null]
      - name: commune
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]

  - name: int_meteo_departement_jour
    description: "Météo agrégée par département et par jour."
    columns:
      - name: date
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]
      - name: nombre_points_meteo
        data_tests: [not_null]
