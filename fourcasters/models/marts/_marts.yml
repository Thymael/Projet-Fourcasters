version: 2

models:

  # ============================================================
  # DIMENSION COMMUNE
  # ============================================================

  - name: dim_commune
    description: >
      Dimension géographique contenant les 360 points
      d'observation météorologique du projet Fourcasters.

    columns:

      - name: code_insee
        description: "Code INSEE unique de la commune."
        data_tests:
          - not_null
          - unique

      - name: commune
        description: "Nom officiel de la commune."
        data_tests:
          - not_null

      - name: numero_departement
        description: "Code du département."
        data_tests:
          - not_null

      - name: region
        description: "Région administrative."
        data_tests:
          - not_null

      - name: latitude
        description: "Latitude du point d'observation."
        data_tests:
          - not_null

      - name: longitude
        description: "Longitude du point d'observation."
        data_tests:
          - not_null


  # ============================================================
  # DIMENSION DATE
  # ============================================================

  - name: dim_date
    description: >
      Calendrier couvrant l'intégralité de la période
      météorologique étudiée.

    columns:

      - name: date
        description: "Date calendaire."
        data_tests:
          - not_null
          - unique

      - name: annee
        data_tests:
          - not_null

      - name: numero_mois
        data_tests:
          - not_null

      - name: saison
        data_tests:
          - not_null


  # ============================================================
  # TABLE DE FAITS METEO
  # ============================================================

  - name: fact_meteo
    description: >
      Table de faits contenant une observation météorologique
      quotidienne par point d'observation.

    columns:

      - name: id_observation_meteo
        description: "Identifiant unique de l'observation."
        data_tests:
          - not_null
          - unique

      - name: date
        description: "Date de l'observation."
        data_tests:
          - not_null

          - relationships:
              arguments:
                to: ref('dim_date')
                field: date

      - name: code_insee
        description: "Commune associée à l'observation."
        data_tests:
          - not_null

          - relationships:
              arguments:
                to: ref('dim_commune')
                field: code_insee

  # ============================================================
  # DIMENSION DEPARTEMENT
  # ============================================================

  - name: dim_departement
    description: >
      Dimension géographique contenant les 96 départements
      de France métropolitaine.

    columns:

      - name: numero_departement
        description: "Code unique du département."
        data_tests:
          - not_null
          - unique

      - name: departement
        description: "Nom du département."
        data_tests:
          - not_null

      - name: region
        description: "Région administrative."
        data_tests:
          - not_null

  # ============================================================
  # TABLE DE FAITS DANGER INCENDIE
  # ============================================================

  - name: fact_danger_incendie
    description: >
      Table de faits contenant les niveaux de danger incendie
      publiés par Météo-France pour chaque département.

    columns:

      - name: id_danger_incendie
        description: "Identifiant unique d'une publication pour un département."
        data_tests:
          - not_null
          - unique

      - name: reference_time
        description: "Date et heure de publication Météo-France."
        data_tests:
          - not_null

      - name: numero_departement
        description: "Code du département."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: numero_departement

      - name: date_prevision
        description: "Date à laquelle s'applique la prévision de danger incendie."
        data_tests:
          - not_null

      - name: echeance
        description: "Échéance de la prévision : J1 ou J2."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['J1', 'J2']

      - name: niveau_danger
        description: "Niveau de danger incendie prévu par Météo-France."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false