version: 2

models:
  - name: dim_commune
    description: "Référentiel des 360 points d'observation."
    columns:
      - name: code_insee
        data_tests: [not_null, unique]
      - name: commune
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]

  - name: dim_departement
    description: "Référentiel des 96 départements métropolitains."
    columns:
      - name: numero_departement
        data_tests: [not_null, unique]
      - name: departement
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]

  - name: dim_date
    description: "Calendrier commun aux observations et aux prévisions."
    columns:
      - name: date
        data_tests: [not_null, unique]
      - name: annee
        data_tests: [not_null]
      - name: numero_mois
        data_tests: [not_null]
      - name: saison
        data_tests: [not_null]

  - name: fact_meteo
    description: "Une observation météo par date et par point."
    columns:
      - name: id_observation_meteo
        data_tests: [not_null, unique]
      - name: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: code_insee
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: code_insee

  - name: fact_danger_incendie
    description: "Une prévision de danger par date, département et échéance."
    columns:
      - name: id_danger_incendie
        data_tests: [not_null, unique]
      - name: reference_time
        data_tests: [not_null]
      - name: numero_departement
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: numero_departement
      - name: date_prevision
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: echeance
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["J1", "J2"]
      - name: niveau_danger
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

  - name: pbi_risque_incendie
    description: "Table plate pour le suivi du danger et de la météo dans Power BI."
    columns:
      - name: id_danger_incendie
        data_tests: [not_null, unique]
      - name: date_publication
        data_tests: [not_null]
      - name: date_prevision
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]
      - name: echeance
        data_tests: [not_null]
      - name: niveau_danger
        data_tests: [not_null]

  - name: ml_features_incendie
    description: >-
      Variables météo disponibles avant chaque publication. Cette table ne
      contient volontairement pas la cible pour éviter une fuite d'information.
    columns:
      - name: id_feature
        data_tests: [not_null, unique]
      - name: date_publication
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]

  - name: ml_train_incendie
    description: >-
      Jeu d'apprentissage pour prévoir le niveau de danger Météo-France à J1
      et J2. La cible est le niveau publié par Météo-France, de 1 à 4.
    columns:
      - name: id_apprentissage
        data_tests: [not_null, unique]
      - name: date_publication
        data_tests: [not_null]
      - name: date_prevision
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]
      - name: echeance
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["J1", "J2"]
      - name: cible_niveau_danger
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
