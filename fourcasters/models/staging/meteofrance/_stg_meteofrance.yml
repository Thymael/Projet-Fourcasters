version: 2

models:
  - name: stg_meteo_forets
    description: "Données Météo-France nettoyées pour l'analyse."
    columns:
      - name: row_hash
        data_tests: [not_null, unique]
      - name: reference_time
        data_tests: [not_null]
      - name: numero_departement
        data_tests: [not_null]
      - name: departement
        data_tests: [not_null]
      - name: niveau_j1
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: niveau_j2
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
