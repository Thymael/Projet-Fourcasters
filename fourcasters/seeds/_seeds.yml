version: 2

seeds:
  - name: referentiel_communes
    description: "Référentiel des 360 points d'observation du projet."
    config:
      column_types:
        commune: STRING
        latitude: FLOAT64
        longitude: FLOAT64
        region: STRING
        departement: STRING
        numero_departement: STRING
        service: STRING
        code_insee: STRING
        centroide: BOOL
    columns:
      - name: commune
        data_tests: [not_null]
      - name: code_insee
        data_tests: [not_null, unique]
      - name: numero_departement
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]
