name: Actualisation quotidienne Fourcasters

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualisation-fourcasters
  cancel-in-progress: false

jobs:
  actualisation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen --no-dev

      - name: Actualiser Open-Meteo
        run: |
          uv run --no-sync python -u scripts/actualiser_fourcasters.py --openmeteo-only

      - name: Actualiser Météo-France
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: |
          uv run --no-sync python -u scripts/actualiser_fourcasters.py --incendie-only

      - name: Configurer dbt
        run: |
          mkdir -p ~/.dbt
          cp fourcasters/profiles.example.yml ~/.dbt/profiles.yml

      - name: Construire et tester les modèles dbt
        run: |
          uv run --no-sync dbt build --project-dir fourcasters
