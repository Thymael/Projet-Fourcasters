name: Actualisation quotidienne Fourcasters

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actualisation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Actualiser Open-Meteo
        run: |
          uv run python -u scripts/actualiser_fourcasters.py --openmeteo-only

      - name: Actualiser Météo-France
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: |
          uv run python -u scripts/actualiser_fourcasters.py --incendie-only

      - name: Configurer dbt
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<'EOF'
          fourcasters:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: fourcasters-openmeteo-loick
                dataset: openmeteo_analyse
                threads: 4
                location: US
          EOF

      - name: Construire et tester les modèles dbt
        run: |
          uv run dbt build --project-dir fourcasters