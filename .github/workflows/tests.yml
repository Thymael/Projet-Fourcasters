name: Vérification du projet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Tester le code Python
        run: uv run pytest -q

      - name: Vérifier les modèles dbt sans connexion à BigQuery
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-profile"
          cp fourcasters/profiles.example.yml "$RUNNER_TEMP/dbt-profile/profiles.yml"
          uv run dbt parse --project-dir fourcasters --profiles-dir "$RUNNER_TEMP/dbt-profile"
